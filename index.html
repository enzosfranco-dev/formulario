<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário DOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cadastro</h1>
    <form id="FormCadastro">
       <label for="nome">Nome</label>
       <input type="text" name="nome" id="nome"
       placeholder="Digite seu nome">
       
       <label for="email">email</label>
       <input type="email" name="email" id="email"
       placeholder="Digite seu e-mail">

       <label for="idade">idade</label>
       <input type="number" name="idade" id="idade" min="0" max="99">

       <label>Sexo<label>
        <div class="grupo-radio">
            <label><input type="radio" name="Sexo" id="Sexo" value="Feminino"> Feminino</label>
            <label><input type="radio" name="Sexo" id="Sexo" value="Masculino"> Masculino</label>
        </div>
        <label>Interesses</label>
        <div class="grupo-box">
            <label><input type="checkbox" name="Interesses" id=""> Esportes</label>
            <label><input type="checkbox" name="Interesses" id=""> Músicas</label>
            <label><input type="checkbox" name="Interesses" id=""> Jogos</label>
        </div>

      <label for="Mensagem">Mensagem (Max.100 caracteres)</label>
      <textarea name="mensagem" maxlength="100"></textarea>
      <div id="contador">0 /100</div>
      <button type="submit">Enviar Cadastro</button>

        
      
    </form>

    <div id="Mensagem=envio"></div>
    <script src="script.js"></script>
</body>
</html>
